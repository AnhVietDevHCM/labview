<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Phòng Thí Nghiệm Vật Lí Ảo</title> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { /* CSS */
      --bg-gradient: linear-gradient(135deg, #0a0f14, #161b22);
      --accent-color: #00f7ff; /* màu Cyan */
      --accent-color-dark: #f700ff; /* màu Magenta Glow */
      --accent-glow: rgba(0, 247, 255, 0.25);
      --accent-glow-dark: rgba(247, 0, 255, 0.2);
      --card-bg: rgba(18, 24, 33, 0.5);
      --text-color: #f1f1f1; 
      --text-color-bright: #ffffff;
      --text-color-muted: #a0a8b3;
      --border-color: rgba(139, 148, 158, 0.25);
      --shadow-color: rgba(0,0,0,0.4);
      --control-bg: rgba(13, 17, 23, 0.6);
      --slider-track: #4a4a52;
      --border-radius-main: 16px;
    }

    body { /* kiểu chung  */
      position: relative;
      background: var(--bg-gradient);
      color: var(--text-color);
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    h2 {
      text-align: center;
      margin: 0 0 20px 0;
      color: var(--accent-color);
      text-shadow: 0 0 8px var(--accent-glow), 0 0 16px var(--accent-glow-dark);
      font-weight: 600;
      animation: text-glow 2s ease-in-out infinite alternate;
    }
    /* hiệu ứng nền */
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0;
        width: 200%; height: 200%;
        background: radial-gradient(circle at 10% 20%, var(--accent-glow), transparent 40%),
                    radial-gradient(circle at 90% 80%, var(--accent-glow-dark), transparent 40%);
        z-index: -2;
        animation: aurora-move 20s linear infinite;
    }
    /* hiệu ứng Scanline */
    body::after {
        content: '';
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px, rgba(0,0,0,0.1) 2px);
        pointer-events: none;
        z-index: -1;
    }
    @keyframes text-glow {
        from { text-shadow: 0 0 8px var(--accent-glow); }
        to { text-shadow: 0 0 16px var(--accent-glow), 0 0 24px var(--accent-glow-dark); }
    }
    @keyframes aurora-move {
        0% { transform: translate(0, 0); }
        50% { transform: translate(-25%, -25%); }
        100% { transform: translate(0, 0); }
    }

   
    body.theme-deep-space { --bg-gradient: linear-gradient(135deg, #1D2B64, #000000); }
    body.theme-nebula { --bg-gradient: linear-gradient(135deg, #23074d, #cc5333); }
    body.theme-sunset { --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364); }
    body.theme-default { --bg-gradient: linear-gradient(135deg, #1a1a2e, #2c2c3e); }

    .main-layout {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 320px;
      flex-shrink: 0;
      background: rgba(13, 17, 23, 0.6);
      border-right: 1px solid var(--border-color);
      padding: 25px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: transform 0.3s ease;
      backdrop-filter: blur(12px);
    }

    .main-content {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius-main);
      padding: 20px;
      border: 1px solid transparent;
      background-clip: padding-box;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px) saturate(120%);
      transition: all 0.3s ease;
      animation: card-fade-in 0.5s ease-out forwards;
      opacity: 0;
    }
    .card:hover {
      box-shadow: 0 0 25px var(--accent-glow), 0 0 40px var(--accent-glow-dark);
      transform: translateY(-2px);
    }
    .card::before {
      content: '';
      position: absolute; inset: 0; border-radius: var(--border-radius-main);
      padding: 1px; /* chiều rộng border */
      background: linear-gradient(135deg, var(--accent-color), var(--accent-color-dark));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    @keyframes card-fade-in {
      to { opacity: 1; transform: translateY(0); }
    }
    canvas {
      background: #10141a; /* A slightly different shade for contrast */
      border-radius: 10px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      width: 100%;
      height: auto;
      border: 1px solid var(--border-color);
      transition: box-shadow 0.3s ease;
    }
    .canvas-wrapper.card:hover canvas {
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 0 15px var(--accent-glow);
    }
    #params {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px 20px;
    }
    .param-item {
      display: flex;
      align-items: center;
      width: 100%;
    }
    .select-wrapper {
      position: relative;
      width: 100%;
    }
    .select-wrapper::after {
      content: '▼';
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      font-size: 0.8em;
      color: var(--text-color-muted);
      pointer-events: none;
    }
    select {
      -webkit-appearance: none;
      appearance: none;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: var(--control-bg);
      color: var(--text-color);
      font-family: 'Poppins', sans-serif;
      width: 100%;
      padding-right: 30px; /* Space for arrow */
      cursor: pointer;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 5px;
      padding: 10px 18px;
      border-radius: 4px;
      border: 1px solid var(--accent-color);
      background: linear-gradient(45deg, transparent 50%, var(--accent-color) 50%);
      background-size: 220%;
      background-position: 0%;
      color: #fff;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer; 
      transition: all 0.4s ease-in-out;
      gap: 8px;
      box-shadow: 0 0 10px var(--accent-glow);
      position: relative;
      overflow: hidden;
    }
    button:hover {
      background-position: 100%;
      color: #000;
      box-shadow: 0 0 25px var(--accent-glow);
    }
    button:active {
      transform: translateY(0);
      filter: brightness(0.9);
    }
    button::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
      transition: left 0.5s;
    }
    button:hover::before {
      left: 100%;
    }
    button:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 2px;
    }
    input[type="number"] {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--control-bg);
      color: var(--text-color);
      font-family: 'Poppins', sans-serif;
      width: 100px;
      text-align: center;
      margin: 0 10px;
    }
    input[type="number"]:focus {
      outline: 2px solid var(--accent-color);
      border-color: var(--accent-color);
    }
    .formula {
      margin: 15px 0;
      color: var(--text-color-bright);
    }
    #info {
      margin-top: 15px;
      font-size: 1em;
      text-align: left;
      line-height: 1.5;
    }
    .slider-label {
      width: 140px;
      text-align: right;
      font-size: 0.85em;
      color: var(--text-color);
      margin-right: 10px;
    }
    .slider-value {
      min-width: 40px; text-align: left;
    }
    .simulation-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 100%;
    }
    .canvas-wrapper {
      flex-grow: 1;
      position: relative;
    }
    .chart-container {
      flex-grow: 1; min-width: 200px; padding: 10px;
    }
    .log-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
    }
    .compact-field {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      margin: 8px 0 10px;
      font-size: 0.9em;
      color: var(--text-color-muted);
    }
    .compact-field input[type="number"] {
      width: 70px;
      margin: 0;
    }
    .compact-field input[type="checkbox"] {
      transform: translateY(1px);
    }
    .record-status {
      font-size: 0.85em;
      color: var(--text-color-muted);
      margin-bottom: 8px;
      text-align: center;
    }
    .log-table-wrap {
      max-height: 170px;
      overflow: auto;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.2);
    }
    .log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78em;
    }
    .log-table th, .log-table td {
      border-bottom: 1px solid var(--border-color);
      padding: 6px 8px;
      text-align: left;
      white-space: nowrap;
    }
    .log-table th {
      position: sticky;
      top: 0;
      background: rgba(11, 15, 22, 0.95);
      color: var(--accent-color);
    }
    .task-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88em;
      color: var(--text-color-muted);
    }
    .task-item.done {
      color: var(--text-color);
    }
    .task-badge {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75em;
      border: 1px solid var(--border-color);
      color: var(--text-color-muted);
      flex-shrink: 0;
    }
    .task-item.done .task-badge {
      border-color: var(--accent-color);
      color: #071319;
      background: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* chủ đề của ứng dụng */
    .theme-switcher {
        position: relative;
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 10px;
        background: rgba(0,0,0,0.2);
        padding: 6px;
        border-radius: 8px;
    }
    .theme-dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition: transform 0.2s, border-color 0.2s;
    }
    .theme-dot:hover {
        transform: scale(1.1);
    }
    .theme-dot.active {
        border-color: var(--accent-color);
        transform: scale(1.2);
    }
    .theme-dot:not(.active):hover {
        border-color: rgba(255,255,255,0.5);
    }
    #theme-default { background: linear-gradient(45deg, #1a1a2e, #2c2c3e); }
    #theme-deep-space { background: linear-gradient(45deg, #1D2B64, #000000); }
    #theme-nebula { background: linear-gradient(45deg, #23074d, #cc5333); }
    #theme-sunset { background: linear-gradient(45deg, #0f2027, #2c5364); }

    .card-header {
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--accent-color);
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 0 5px var(--accent-glow);
    }
    .card-header .icon {
      opacity: 0.8;
    }

    .speed-indicator {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8em;
      font-weight: 600;
    }

    .sidebar-toggle {
      display: none; /* hiển thị trên thiết bị di động */
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1001;
      width: 40px;
      height: 40px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      backdrop-filter: blur(5px);
    }

    /* hiệu ứng cho thanh bên */ 
    
    /* điều chỉnh cho thiết bị di động */
    @media (max-width: 768px) {
        .sidebar {
          position: fixed;
          left: 0; top: 0; bottom: 0;
          z-index: 1000;
          transform: translateX(-100%);
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .main-content {
          padding: 15px;
        }
        .sidebar-toggle {
          display: flex;
        }
    }
    .icon { width: 1em; height: 1em; fill: currentColor; }
    .sidebar-toggle .icon { transition: transform 0.3s ease; }
    .sidebar.open + .main-content .sidebar-toggle .icon { transform: rotate(90deg); }

    /* thanh cuộn tùy chỉnh */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent-color);
      border-radius: 4px;
    }

  </style>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <button class="sidebar-toggle" id="sidebarToggle" title="Mở/Đóng menu"><svg class="icon" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
  <div class="main-layout">
    <aside class="sidebar" id="sidebar">
      <h2>Phòng Thí Nghiệm Vật Lí Ảo</h2>
      <div class="card" style="animation-delay: 0.1s;">
        <div class="card-header"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>Điều khiển chính</div>
        <div style="text-align: center;">
          <button onclick="resetExperiment()" title="Khởi động lại"><svg class="icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
          <button onclick="togglePause()" id="pauseBtn" title="Tạm dừng/Tiếp tục"><svg class="icon" id="pauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg><svg class="icon" id="playIcon" viewBox="0 0 24 24" style="display:none;"><path d="M8 5v14l11-7z"/></svg></button>
          <button onclick="speedDown()" title="Tua chậm"><svg class="icon" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6 8.5 6V6l-8.5 6z"/></svg></button>
          <button onclick="speedUp()" title="Tua nhanh"><svg class="icon" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></button>
          <button onclick="toggleHeating()" id="heatBtn" title="Bật/Tắt lửa" style="display: none;"><svg class="icon" viewBox="0 0 24 24"><path d="M13.04,1.41l-2.1,2.1c-0.12,0.12-0.18,0.28-0.18,0.44v1.2c0,0.41,0.34,0.75,0.75,0.75s0.75-0.34,0.75-0.75v-0.69l1.3,1.3 c1.9,1.9,1.9,5,0,6.9c-1.9,1.9-5,1.9-6.9,0c-1.9-1.9-1.9-5,0-6.9l1.3-1.3V5.75C8.66,5.34,8.32,5,7.91,5s-0.75,0.34-0.75,0.75v1.2 c0,0.16-0.06,0.32-0.18,0.44l-2.1,2.1C3.01,11.36,2,13.85,2,16.5C2,20.09,4.91,23,8.5,23s6.5-2.91,6.5-6.5 C15,13.85,14.79,11.36,13.04,1.41z M8.5,21C6.02,21,4,18.98,4,16.5c0-1.74,0.71-3.33,1.88-4.5l1.41-1.41c0.12-0.12,0.18-0.28,0.18-0.44 V8.75c0-0.41,0.34-0.75,0.75-0.75s0.75,0.34,0.75,0.75v1.41c0,0.16,0.06,0.32,0.18,0.44l1.41,1.41C12.29,13.17,13,14.76,13,16.5 C13,18.98,10.98,21,8.5,21z"/></svg></button>
        </div>
      </div>

      <div class="card" style="animation-delay: 0.2s;">
        <div class="card-header"><svg class="icon" viewBox="0 0 24 24"><path d="M19.48 12.04c-1.34-.78-2.2-2.2-2.2-3.79V2h-2.5v6.25c0 1.59-.86 3.01-2.2 3.79-1.34.78-2.2 2.2-2.2 3.79V22h2.5v-6.25c0-1.59.86-3.01 2.2-3.79 1.34-.78 2.2-2.2 2.2-3.79V2h2.5v6.25c0 1.59.86 3.01 2.2 3.79 1.34.78 2.2 2.2 2.2 3.79V22h-2.5v-6.21c0-1.59-.86-3.01-2.2-3.75z"/></svg>Thí nghiệm</div>
        <div class="select-wrapper">
            <select id="experiment" onchange="changeExperiment()">
                <option value="pendulum">Con lắc đơn</option>
                <option value="spring">Lò xo</option>
                <option value="projectile">Chuyển động ném ngang</option>
                <option value="ideal_gas">Khí lý tưởng</option>
                <option value="thermo">Nhiệt động lực học</option>
                <option value="spring_horizontal">Con lắc lò xo ngang</option>
                <option value="inclined_plane">Mặt phẳng nghiêng</option>
            </select>
        </div>
        <div class="formula" id="formula"></div>
      </div>

      <div class="card" style="animation-delay: 0.3s;">
        <div class="card-header"><svg class="icon" viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>Thông số</div>
        <div id="params"></div>
      </div>

      <div class="card" id="info" style="animation-delay: 0.4s;"></div>

      <div class="card" style="animation-delay: 0.5s;">
        <div class="card-header"><svg class="icon" viewBox="0 0 24 24"><path d="M3 3h18v2H3V3zm2 4h14c1.1 0 2 .9 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9c0-1.1.9-2 2-2zm2 3v2h10v-2H7zm0 4v2h6v-2H7z"/></svg>Nhật ký thí nghiệm</div>
        <div class="log-controls">
          <button onclick="logSample()" title="Ghi dữ liệu hiện tại">Ghi mẫu</button>
          <button onclick="clearLabRecords()" title="Xóa toàn bộ dữ liệu">Xóa mẫu</button>
          <button onclick="exportLabRecords()" title="Xuất dữ liệu CSV">Xuất CSV</button>
        </div>
        <div class="compact-field">
          <label for="autoRecordSec">Tự ghi mỗi</label>
          <input type="number" id="autoRecordSec" min="0.2" max="30" step="0.1" value="1">
          <span>giây</span>
          <label><input type="checkbox" id="autoRecordEnabled"> Bật</label>
        </div>
        <div id="recordStatus" class="record-status">Chưa có mẫu dữ liệu.</div>
        <div class="log-table-wrap">
          <table class="log-table" id="recordTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Thời điểm</th>
                <th>Thí nghiệm</th>
                <th>Tóm tắt</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="card" style="animation-delay: 0.55s;">
        <div class="card-header"><svg class="icon" viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.2l5 5 11-11-1.5-1.5z"/></svg>Mục tiêu học tập</div>
        <ul id="taskList" class="task-list"></ul>
      </div>

      <div class="card" style="animation-delay: 0.6s;">

    <main class="main-content">
      <div class="simulation-area">
          <div class="canvas-wrapper card">
            <canvas id="canvas" width="700" height="450"></canvas>
            <div id="speedIndicator" class="speed-indicator">x1</div>

  </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let experiment = 'pendulum';
        let isPaused = false;
        let speed = 1;
        let energyChart;
        let chartData = { KE: [], PE: [], E: [], labels: [] };
        const timeStep = 0.016; // ~60 FPS

        // Con lắc đơn
        let pendulum = { // Các thông số cho thí nghiệm con lắc đơn
            length: 1, // Chiều dài dây treo (mét)
            angle: Math.PI / 6, // góc (rad)
            damping: 0.1, // Hệ số cản của môi trường
            aVel: 0, aAcc: 0,
            gravity: 9.81, // gia tốc trọng trường (m/s^2)
            origin: { x: 350, y: 60 },
            mass: 0.2, // kg
            t: 0 // thời gian mô phỏng
        };

        // Lò xo
        let spring = { // Các thông số cho thí nghiệm con lắc lò xo (treo thẳng đứng)
            k: 20, // N/m
            mass: 0.5, // kg
            amplitude: 0.2, // Biên độ dao động (mét)
            damping: 0.2, // Hệ số cản của môi trường
            t: 0 // Thời gian mô phỏng (s)
        };

        // Ném ngang
        let projectile = { // Các thông số cho thí nghiệm ném ngang
            x: 60, y: 60,
            vx: 10, // m/s
            damping: 0.01, // Hệ số cản không khí
            vy: 0,
            g: 9.81, // m/s^2
            radius: 15,
            ground: 430, // Tọa độ y của mặt đất (pixel)
            t: 0, // Thời gian mô phỏng (s)
            h0: 4, // Độ cao ban đầu (mét)
            mass: 0.1 // kg
        };

        // Khí lý tưởng
        let idealGas = {
            P: 101325, // Pa
            V: 0.0224, // m³
            n: 1, // mol
            T: 273, // K
            R: 8.314, // J/mol.K
            box: { x: 230, y: 100, w: 240, h: 200 },
            M: 0.028, // kg/mol (Khí N2)
            molecules: []
        };

        // Nhiệt động lực học
        let thermo = { // Các thông số cho thí nghiệm nhiệt động lực học
            Q: 0, // Nhiệt lượng trao đổi (J)
            m: 1, // kg
            c: 4200, // Nhiệt dung riêng mặc định (J/kg.K)
            c_water: 4200, // Nhiệt dung riêng của nước (J/kg.K)
            c_ice: 2100,   // Nhiệt dung riêng của đá (J/kg.K)
            Lf: 334000,  // nhiệt nóng chảy (J/kg)
            // Lv: 2260000, //  nhiệt hóa hơi (J/kg) - có thể thêm nếu muốn mô phỏng cả quá trình bay hơi
            T0: 25, // Nhiệt độ ban đầu (°C)
            T: 25, // Nhiệt độ hiện tại (°C)
            heating: false, // Trạng thái đang đun nóng hay không
            radiate: false, // Có tỏa nhiệt ra môi trường hay không
            autoCool: false, // Có bật quạt làm mát
            fanPower: 0, // Công suất quạt làm mát (W)
            T_env: 20, // Nhiệt độ môi trường (°C)
            hasIce: false, // Có cục đá hay không
            power: 500, // Công suất đun nóng (W)
            state: 'LIQUID', // Trạng thái vật chất: rắn (ICE), lỏng (LIQUID), khí (GAS)
            lastUpdate: 0, // Mốc thời gian để tính delta t
            m_container: 0.5, // Khối lượng bình chứa (kg)
            c_container: 900,  // nhiệt dung riêng của bình chứa (J/kg.K) (Nhôm)
            t: 0 // Thời gian mô phỏng
        };

        // Con lắc lò xo ngang
        let spring_horizontal = {
            k: 20, // độ cứng (N/m)
            mass: 0.5, // khối lượng (kg)
            amplitude: 0.2, // biên độ (m)
            damping: 0.2, // Hệ số cản
            x0: 350, // Vị trí cân bằng (px)
            t: 0 // thời gian mô phỏng
        };

        // Mặt phẳng nghiêng
        let inclined_plane = {
            angle: 30, // góc (độ)
            mass: 1, // khối lượng vật (kg)
            g: 9.81, // gia tốc trọng trường (m/s^2)
            friction: 0.1, // Hệ số ma sát
            F_pull: 0, // Lực kéo (N)
            s: 0, // Quãng đường đi được (m) - s > 0 là đi lên, s < 0 là đi xuống
            v: 0, t: 0 // Vận tốc (m/s), thời gian (s)
        };

        // Nâng cấp workflow học tập
        const labRecords = [];
        const MAX_RECORDS = 1000;
        const experimentStats = {};
        let autoRecordEnabled = false;
        let autoRecordIntervalSec = 1;
        let lastAutoRecordAt = 0;

        function getExperimentStats(exp = experiment) {
            if (!experimentStats[exp]) {
                experimentStats[exp] = {
                    paramChanges: 0,
                    samples: 0,
                    pauseUsed: false,
                    speedUsed: false
                };
            }
            return experimentStats[exp];
        }

        function formatMetric(value, precision = 3) {
            return Number.isFinite(value) ? Number(value).toFixed(precision) : '--';
        }

        function getSimulationTime() {
            if (experiment === 'pendulum') return pendulum.t || 0;
            if (experiment === 'spring') return spring.t || 0;
            if (experiment === 'projectile') return projectile.t || 0;
            if (experiment === 'ideal_gas') return idealGas.t || 0;
            if (experiment === 'thermo') return thermo.t || 0;
            if (experiment === 'spring_horizontal') return spring_horizontal.t || 0;
            if (experiment === 'inclined_plane') return inclined_plane.t || 0;
            return 0;
        }

        function getEnergySnapshot() {
            if (experiment === 'pendulum') {
                const h = pendulum.length * (1 - Math.cos(pendulum.angle));
                const PE = pendulum.mass * pendulum.gravity * h;
                const v = pendulum.length * pendulum.aVel;
                const KE = 0.5 * pendulum.mass * v * v;
                return { KE, PE, E: KE + PE };
            }
            if (experiment === 'spring') {
                const omega = Math.sqrt(spring.k / spring.mass);
                const currentAmplitude = spring.amplitude * Math.exp(-(spring.damping / (2 * spring.mass)) * spring.t);
                const x = currentAmplitude * Math.cos(omega * spring.t);
                const v = -Math.exp(-(spring.damping / (2 * spring.mass)) * spring.t) *
                    (((spring.damping / (2 * spring.mass)) * spring.amplitude * Math.cos(omega * spring.t)) + (omega * spring.amplitude * Math.sin(omega * spring.t)));
                const KE = 0.5 * spring.mass * v * v;
                const PE = 0.5 * spring.k * x * x;
                return { KE, PE, E: KE + PE };
            }
            if (experiment === 'spring_horizontal') {
                const omega = Math.sqrt(spring_horizontal.k / spring_horizontal.mass);
                const currentAmplitude = spring_horizontal.amplitude * Math.exp(-(spring_horizontal.damping / (2 * spring_horizontal.mass)) * spring_horizontal.t);
                const x = currentAmplitude * Math.cos(omega * spring_horizontal.t);
                const v = -Math.exp(-(spring_horizontal.damping / (2 * spring_horizontal.mass)) * spring_horizontal.t) *
                    (((spring_horizontal.damping / (2 * spring_horizontal.mass)) * spring_horizontal.amplitude * Math.cos(omega * spring_horizontal.t)) + (omega * spring_horizontal.amplitude * Math.sin(omega * spring_horizontal.t)));
                const KE = 0.5 * spring_horizontal.mass * v * v;
                const PE = 0.5 * spring_horizontal.k * x * x;
                return { KE, PE, E: KE + PE };
            }
            if (experiment === 'projectile') {
                const scale = 40;
                const currentH = (projectile.ground - projectile.y) / scale;
                const vTotal = Math.sqrt(projectile.vx * projectile.vx + projectile.vy * projectile.vy);
                const KE = 0.5 * projectile.mass * vTotal * vTotal;
                const PE = projectile.mass * projectile.g * Math.max(0, currentH);
                return { KE, PE, E: KE + PE };
            }
            if (experiment === 'inclined_plane') {
                const rad = inclined_plane.angle * Math.PI / 180;
                const h = Math.max(0, inclined_plane.s * Math.sin(rad));
                const KE = 0.5 * inclined_plane.mass * Math.pow(inclined_plane.v, 2);
                const PE = inclined_plane.mass * inclined_plane.g * h;
                return { KE, PE, E: KE + PE };
            }
            return null;
        }

        function getCurrentRecordValues() {
            const energy = getEnergySnapshot();
            if (experiment === 'pendulum') {
                return {
                    angle_deg: pendulum.angle * 180 / Math.PI,
                    omega_rad_s: pendulum.aVel,
                    KE_J: energy ? energy.KE : 0,
                    PE_J: energy ? energy.PE : 0,
                    E_J: energy ? energy.E : 0
                };
            }
            if (experiment === 'spring') {
                return {
                    t_s: spring.t,
                    k_N_m: spring.k,
                    m_kg: spring.mass,
                    KE_J: energy ? energy.KE : 0,
                    PE_J: energy ? energy.PE : 0,
                    E_J: energy ? energy.E : 0
                };
            }
            if (experiment === 'spring_horizontal') {
                return {
                    t_s: spring_horizontal.t,
                    k_N_m: spring_horizontal.k,
                    m_kg: spring_horizontal.mass,
                    KE_J: energy ? energy.KE : 0,
                    PE_J: energy ? energy.PE : 0,
                    E_J: energy ? energy.E : 0
                };
            }
            if (experiment === 'projectile') {
                return {
                    t_s: projectile.t,
                    x_px: projectile.x,
                    y_px: projectile.y,
                    vx_m_s: projectile.vx,
                    vy_m_s: projectile.vy,
                    KE_J: energy ? energy.KE : 0,
                    PE_J: energy ? energy.PE : 0,
                    E_J: energy ? energy.E : 0
                };
            }
            if (experiment === 'ideal_gas') {
                const vAvg = idealGas.T > 0 ? Math.sqrt(3 * idealGas.R * idealGas.T / idealGas.M) : 0;
                return {
                    P_kPa: idealGas.P / 1000,
                    V_m3: idealGas.V,
                    T_K: idealGas.T,
                    n_mol: idealGas.n,
                    molecule_count: idealGas.molecules.length,
                    v_avg_m_s: vAvg
                };
            }
            if (experiment === 'thermo') {
                return {
                    t_s: thermo.t,
                    T_C: thermo.T,
                    state: thermo.state,
                    Q_J: thermo.Q,
                    power_W: thermo.power,
                    fan_W: thermo.fanPower
                };
            }
            if (experiment === 'inclined_plane') {
                return {
                    t_s: inclined_plane.t,
                    s_m: inclined_plane.s,
                    v_m_s: inclined_plane.v,
                    angle_deg: inclined_plane.angle,
                    F_pull_N: inclined_plane.F_pull,
                    KE_J: energy ? energy.KE : 0,
                    PE_J: energy ? energy.PE : 0,
                    E_J: energy ? energy.E : 0
                };
            }
            return {};
        }

        function logSample(source = 'manual') {
            const values = getCurrentRecordValues();
            const now = new Date();
            labRecords.push({
                id: labRecords.length + 1,
                source,
                experiment,
                isoTime: now.toISOString(),
                displayTime: now.toLocaleTimeString('vi-VN', { hour12: false }),
                simTime: getSimulationTime(),
                values
            });
            if (labRecords.length > MAX_RECORDS) labRecords.shift();
            getExperimentStats().samples++;
            renderRecordTable();
            renderTaskChecklist();
        }

        function clearLabRecords() {
            labRecords.length = 0;
            getExperimentStats().samples = 0;
            renderRecordTable();
            renderTaskChecklist();
        }

        function csvEscape(value) {
            const text = value === null || value === undefined ? '' : String(value);
            return `"${text.replace(/"/g, '""')}"`;
        }

        function exportLabRecords() {
            if (labRecords.length === 0) {
                alert('Chưa có dữ liệu để xuất.');
                return;
            }
            const metricKeys = [...new Set(labRecords.flatMap(record => Object.keys(record.values || {})))];
            const columns = ['stt', 'thoi_diem', 'thoi_diem_iso', 'thi_nghiem', 'thoi_gian_mo_phong_s', 'nguon', ...metricKeys];
            const rows = labRecords.map((record, index) => {
                const base = [
                    index + 1,
                    record.displayTime,
                    record.isoTime,
                    record.experiment,
                    Number.isFinite(record.simTime) ? record.simTime.toFixed(4) : '',
                    record.source
                ];
                const metricValues = metricKeys.map(key => {
                    if (!record.values) return '';
                    const value = record.values[key];
                    return value === undefined || value === null ? '' : value;
                });
                return [...base, ...metricValues];
            });
            const csvContent = [
                columns.map(csvEscape).join(','),
                ...rows.map(row => row.map(csvEscape).join(','))
            ].join('\n');
            const blob = new Blob([`\uFEFF${csvContent}`], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `virtual_lab_records_${Date.now()}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function getRecordSummary(values) {
            const keys = Object.keys(values || {}).slice(0, 2);
            if (keys.length === 0) return 'Không có dữ liệu';
            return keys.map(key => {
                const val = values[key];
                const text = typeof val === 'number' ? formatMetric(val, 2) : String(val);
                return `${key}: ${text}`;
            }).join(' | ');
        }

        function renderRecordTable() {
            const tbody = document.querySelector('#recordTable tbody');
            const status = document.getElementById('recordStatus');
            if (!tbody || !status) return;
            if (labRecords.length === 0) {
                tbody.innerHTML = '';
                status.innerText = 'Chưa có mẫu dữ liệu.';
                return;
            }
            const recentRecords = labRecords.slice(-8).reverse();
            tbody.innerHTML = recentRecords.map((record, idx) => `
                <tr>
                    <td>${labRecords.length - idx}</td>
                    <td>${record.displayTime}</td>
                    <td>${record.experiment}</td>
                    <td>${getRecordSummary(record.values)}</td>
                </tr>
            `).join('');
            status.innerText = `Tổng mẫu: ${labRecords.length} | Tự ghi: ${autoRecordEnabled ? `Bật (${autoRecordIntervalSec}s)` : 'Tắt'}`;
        }

        function syncAutoRecordControls() {
            const secInput = document.getElementById('autoRecordSec');
            const enabledInput = document.getElementById('autoRecordEnabled');
            if (secInput) secInput.value = autoRecordIntervalSec;
            if (enabledInput) enabledInput.checked = autoRecordEnabled;
            renderRecordTable();
        }

        function updateAutoRecordSettings() {
            const secInput = document.getElementById('autoRecordSec');
            const enabledInput = document.getElementById('autoRecordEnabled');
            const interval = parseFloat(secInput ? secInput.value : '');
            autoRecordIntervalSec = Number.isFinite(interval) ? Math.min(30, Math.max(0.2, interval)) : 1;
            autoRecordEnabled = !!(enabledInput && enabledInput.checked);
            if (secInput) secInput.value = autoRecordIntervalSec;
            lastAutoRecordAt = performance.now();
            renderRecordTable();
            saveState();
        }

        function maybeAutoRecord(nowMs) {
            if (!autoRecordEnabled || isPaused) return;
            if ((nowMs - lastAutoRecordAt) >= autoRecordIntervalSec * 1000) {
                logSample('auto');
                lastAutoRecordAt = nowMs;
            }
        }

        function renderTaskChecklist() {
            const taskList = document.getElementById('taskList');
            if (!taskList) return;
            const stats = getExperimentStats();
            const chartPoints = (chartData && Array.isArray(chartData.labels)) ? chartData.labels.length : 0;
            const tasks = [
                { done: stats.paramChanges > 0, label: 'Đã thay đổi ít nhất 1 thông số.' },
                { done: stats.pauseUsed || stats.speedUsed, label: 'Đã dùng nút tạm dừng hoặc tua tốc độ.' },
                { done: chartPoints >= 20, label: 'Đồ thị đã tích lũy tối thiểu 20 điểm.' },
                { done: stats.samples >= 3, label: 'Đã ghi tối thiểu 3 mẫu dữ liệu.' }
            ];
            taskList.innerHTML = tasks.map(task => `
                <li class="task-item ${task.done ? 'done' : ''}">
                    <span class="task-badge">${task.done ? '✓' : '•'}</span>
                    <span>${task.label}</span>
                </li>
            `).join('');
        }

        // Khởi tạo các phân tử khí cho mô phỏng khí lý tưởng
        function initMolecules() {
            idealGas.molecules = [];
            let count = Math.min(Math.round(idealGas.n * 50), 100);
            let maxVolumeDisplay = 0.1;
            let volumeHeight = (idealGas.V / maxVolumeDisplay) * idealGas.box.h;
            for (let i = 0; i < count; i++) {
                idealGas.molecules.push({
                    x: idealGas.box.x + 10 + Math.random() * (idealGas.box.w - 20),
                    y: idealGas.box.y + 10 + Math.random() * Math.max(1, volumeHeight - 20),
                    vx: (idealGas.T == 0 ? 0 : (Math.random() - 0.5) * Math.sqrt(idealGas.T) * 0.1),
                    vy: (idealGas.T == 0 ? 0 : (Math.random() - 0.5) * Math.sqrt(idealGas.T) * 0.1)
                });
            }
        }

        // Vẽ lại con lắc đơn trên canvas
        function drawPendulum() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let pxLength = pendulum.length * 150; // Chuyển đổi độ dài từ mét sang pixel để vẽ
            let x = pendulum.origin.x + pxLength * Math.sin(pendulum.angle);
            let y = pendulum.origin.y + pxLength * Math.cos(pendulum.angle);
            ctx.beginPath();
            ctx.moveTo(pendulum.origin.x, pendulum.origin.y);
            ctx.lineTo(x, y);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, 2 * Math.PI);
            ctx.fillStyle = "#ffb300";
            ctx.shadowColor = "#ffb300";
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(pendulum.origin.x, pendulum.origin.y, 8, 0, 2 * Math.PI);
            ctx.fillStyle = "#fff";
            ctx.fill();
        }

        // Cập nhật trạng thái của con lắc đơn
        function updatePendulum(dt = timeStep) {
            pendulum.aAcc = (-pendulum.gravity / pendulum.length) * Math.sin(pendulum.angle);
            let dampingForce = -pendulum.damping * pendulum.aVel;
            pendulum.aVel += (pendulum.aAcc + dampingForce) * dt;
            pendulum.angle += pendulum.aVel * dt;
            pendulum.t += dt;
        }

        // Vẽ lại lò xo thẳng đứng trên canvas
        function drawSpring() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let omega = Math.sqrt(spring.k / spring.mass);
            // Tính biên độ hiện tại dựa trên sự tắt dần
            let current_amplitude = spring.amplitude * Math.exp(-(spring.damping / (2 * spring.mass)) * spring.t);
            let y = 200 + current_amplitude * Math.cos(omega * spring.t) * 300;
            ctx.beginPath();
            ctx.moveTo(350, 50);
            ctx.lineTo(350, y - 20);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 6;
            ctx.stroke();
            ctx.beginPath();
            ctx.rect(320, y - 20, 60, 40);
            ctx.fillStyle = "#ffb300";
            ctx.shadowColor = "#ffb300";
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(350, 50, 8, 0, 2 * Math.PI);
            ctx.fillStyle = "#fff";
            ctx.fill();
        }

        // Cập nhật trạng thái của lò xo thẳng đứng
        function updateSpring(dt = timeStep) {
            spring.t += dt;
        }

        // Vẽ lại con lắc lò xo ngang trên canvas
        function drawSpringHorizontal() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let omega = Math.sqrt(spring_horizontal.k / spring_horizontal.mass);
            // Tính biên độ hiện tại dựa trên sự tắt dần
            let current_amplitude = spring_horizontal.amplitude * Math.exp(-(spring_horizontal.damping / (2 * spring_horizontal.mass)) * spring_horizontal.t);
            let x = spring_horizontal.x0 + current_amplitude * Math.cos(omega * spring_horizontal.t) * 300;
            ctx.beginPath();
            ctx.moveTo(150, 225);
            ctx.lineTo(x, 225);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 6;
            ctx.stroke();
            ctx.beginPath();
            ctx.rect(x, 205, 40, 40);
            ctx.fillStyle = "#ffb300";
            ctx.fill();
        }

        // Cập nhật trạng thái của con lắc lò xo ngang
        function updateSpringHorizontal(dt = timeStep) {
            spring_horizontal.t += dt;
        }

        // Vẽ lại vật ném ngang trên canvas
        function drawProjectile() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(0, projectile.ground);
            ctx.lineTo(canvas.width, projectile.ground);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(projectile.x, projectile.y, projectile.radius, 0, 2 * Math.PI);
            ctx.fillStyle = "#ffb300";
            ctx.shadowColor = "#ffb300";
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Cập nhật trạng thái của vật ném ngang
        function updateProjectile(dt = timeStep) {
            const scale = 40; // Tỷ lệ: 40px trên canvas tương ứng 1m trong thực tế
            if (projectile.y + projectile.radius < projectile.ground) {
                projectile.t += dt;
                // Cập nhật vận tốc (có tính lực cản không khí)
                projectile.vy += projectile.g * dt;
                projectile.vx -= projectile.damping * projectile.vx * dt;
                projectile.vy -= projectile.damping * projectile.vy * dt;
                // Cập nhật vị trí dựa trên vận tốc
                projectile.x += projectile.vx * dt * scale;
                projectile.y += projectile.vy * dt * scale;
            } else {
                // Khi chạm đất, đảm bảo vật dừng chính xác trên mặt đất, không bị lún xuống
                projectile.y = projectile.ground - projectile.radius;
            }
        }

        // Vẽ lại mô phỏng khí lý tưởng trên canvas
        function drawIdealGas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.strokeRect(idealGas.box.x, idealGas.box.y, idealGas.box.w, idealGas.box.h);
            // Vẽ piston. 0.1 là giá trị max của slider V, tương ứng với chiều cao tối đa của hộp.
            let maxVolumeDisplay = 0.1;
            let volumeHeight = (idealGas.V / maxVolumeDisplay) * idealGas.box.h;
            let pistonY = idealGas.box.y + volumeHeight;
            ctx.fillStyle = "#aaa";
            ctx.fillRect(idealGas.box.x, pistonY, idealGas.box.w, 10);
            
            idealGas.molecules.forEach(mol => {
                ctx.beginPath();
                ctx.arc(mol.x, mol.y, 5, 0, 2 * Math.PI);
                ctx.fillStyle = idealGas.T > 0 ? "#ffb300" : "#888";
                ctx.fill();
            });
        }

        // Cập nhật trạng thái của các phân tử khí
        function updateIdealGas(dt = timeStep) {
            if (isPaused) return;
            let maxVolumeDisplay = 0.1;
            let volumeHeight = (idealGas.V / maxVolumeDisplay) * idealGas.box.h;
            let pistonY = idealGas.box.y + volumeHeight; // Vị trí của piston, V tăng -> piston xuống dưới -> thể tích lớn
            idealGas.t = (idealGas.t || 0) + dt;
            if (idealGas.T == 0) { // Dừng chuyển động hoàn toàn khi T=0K (điểm không tuyệt đối)
                idealGas.molecules.forEach(mol => {
                    mol.vx = 0; mol.vy = 0; // Vận tốc phân tử về 0, các phân tử dừng chuyển động
                    // Không cho rơi xuống đáy, giữ vị trí hiện tại để dừng chuyển động
                });
                return;
            }

            idealGas.P = (idealGas.n * idealGas.R * idealGas.T) / idealGas.V;
            idealGas.molecules.forEach(mol => {
                mol.x += mol.vx * dt * 60;
                mol.y += mol.vy * dt * 60;
                // Va chạm với tường trái/phải
                if (mol.x < idealGas.box.x + 5) {
                    mol.x = idealGas.box.x + 5; // Ngăn không cho dính vào tường
                    mol.vx *= -1;
                } else if (mol.x > idealGas.box.x + idealGas.box.w - 5) {
                    mol.x = idealGas.box.x + idealGas.box.w - 5; // Ngăn không cho dính vào tường
                    mol.vx *= -1;
                }
                // Va chạm với tường trên
                if (mol.y < idealGas.box.y + 5) {
                    mol.y = idealGas.box.y + 5; // Ngăn không cho dính vào tường
                    mol.vy *= -1;
                }
                // Va chạm với piston (ranh giới dưới của khí): gas nằm giữa box.y (trên) và pistonY (dưới)
                if (mol.y > pistonY - 5) {
                    mol.y = pistonY - 5;
                    mol.vy *= -1;
                }

            });
        }

        // Vẽ lại mô phỏng nhiệt động lực học trên canvas
        function drawThermo() {

                ctx.fillRect(280, 250, 140, 100);
            }
            ctx.restore(); // Bỏ giới hạn clip

            // Vẽ cục đá nếu có
            if (thermo.hasIce) {
                ctx.save();

                ctx.lineWidth = 1;
                ctx.stroke();
                // Vẽ đường nứt
                ctx.beginPath();
                ctx.moveTo(340, 310); ctx.lineTo(360, 330);
                ctx.moveTo(360, 310); ctx.lineTo(340, 330);
                ctx.stroke();
                ctx.restore();
            }

            // Vẽ lại đường viền bình
            ctx.beginPath();
            ctx.arc(350, 350, 70, 0, Math.PI); ctx.lineTo(280, 250);
            ctx.arc(350, 250, 70, Math.PI, 2*Math.PI); ctx.closePath();
            ctx.strokeStyle = "#ccc"; ctx.lineWidth = 2; ctx.stroke();

            // Vẽ nhiệt kế
            ctx.fillStyle = "#fff";
            ctx.fillRect(520, 170, 12, 120);
            ctx.fillRect(520, 150, 12, 160); // Thân nhiệt kế dài hơn

            ctx.arc(526, 310, 16, 0, 2 * Math.PI); // Bầu nhiệt kế
            ctx.fill();

            // Cột thủy ngân, map từ -50°C đến 150°C
            let tempH = Math.max(0, Math.min((thermo.T + 50) / 200 * 160, 160));
            ctx.fillStyle = "#ff4e50";
            ctx.fillRect(522, 310 - tempH, 8, tempH);

            // Hiệu ứng đun nóng và sôi

        // Cập nhật trạng thái của thí nghiệm nhiệt động lực học
        function updateThermo() {
            let now = Date.now();
            let dt = (now - (thermo.lastUpdate || now)) / 1000;
            thermo.lastUpdate = now;
            thermo.t += dt * speed;

            let energyChange = 0;
            if (thermo.heating) { // Nhận nhiệt
                energyChange = thermo.power * dt * speed; // Sử dụng công suất có thể điều chỉnh
            }
            if (thermo.radiate) { // Tỏa nhiệt ra môi trường (Định luật Newton về sự nguội đi)
                energyChange += -thermo.m * 5 * (thermo.T - thermo.T_env) * dt * speed;
            }
            if (thermo.autoCool) { // Quạt làm mát tạo nhiệt mất cố định
                energyChange += -thermo.fanPower * dt * speed;
            }
            thermo.Q += energyChange;

            // Xử lý các quá trình chuyển trạng thái
            switch(thermo.state) {
                case 'SOLID': {
                    const totalHeatCapacity = (thermo.m * thermo.c_ice) + (thermo.m_container * thermo.c_container);
                    thermo.T += energyChange / totalHeatCapacity;
                    if (thermo.T >= 0) { thermo.T = 0; thermo.state = 'MELTING'; }
                    break;
                }
                case 'MELTING': {
                    // Nhiệt độ không đổi, chỉ có nhiệt lượng thay đổi
                    if (thermo.Q > thermo.m * thermo.Lf) {
                        thermo.Q = thermo.Q - thermo.m * thermo.Lf;
                        thermo.state = 'LIQUID';
                    } else if (thermo.Q < 0) {
                        thermo.Q = 0;
                        thermo.state = 'SOLID';
                    }
                    break;
                }
                case 'LIQUID': {
                    const totalHeatCapacity = (thermo.m * thermo.c_water) + (thermo.m_container * thermo.c_container);
                    thermo.T += energyChange / totalHeatCapacity;
                    if (thermo.T < 0) {
                        thermo.T = 0;
                        thermo.state = 'MELTING';
                    } else if (thermo.T > 100) {
                        // Giữ nhiệt độ ở 100°C trong mô phỏng này để tránh xử lý hơi nước phức tạp
                        thermo.T = 100;
                    }
                    thermo.hasIce = false; // Khi ở trạng thái lỏng, không còn đá
                    break;
                }
            }
        }

        // Vẽ lại mô phỏng mặt phẳng nghiêng trên canvas
        function drawInclinedPlane() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let rad = inclined_plane.angle * Math.PI / 180;
            const scale = 40; // Tỷ lệ: 40px trên canvas tương ứng 1m trong thực tế
            // Vẽ mặt phẳng nghiêng
            const startX = 150, startY = 400;
            const endX = 600;
            const endY = startY - Math.tan(rad) * (endX - startX);
            const planeLengthPx = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 8;
            ctx.stroke();

            // Vật nặng
            let current_s_px = inclined_plane.s * scale;
            let current_x = startX + current_s_px * Math.cos(rad);
            let current_y = startY - current_s_px * Math.sin(rad);

            ctx.save();
            ctx.translate(current_x, current_y);
            ctx.rotate(-rad);
            ctx.fillStyle = "#fff874";
            ctx.fillRect(-20, -20, 40, 40);
            ctx.restore();
        }

        // Cập nhật trạng thái của vật trên mặt phẳng nghiêng
        function updateInclinedPlane(dt = timeStep) {
            const planeLengthM = (600 - 150) / 40 / Math.cos(inclined_plane.angle * Math.PI / 180);
            const rad = inclined_plane.angle * Math.PI / 180;
            const m = inclined_plane.mass;
            const g = inclined_plane.g;
            const mu = inclined_plane.friction;
            const F_pull = inclined_plane.F_pull;

            // Các lực tác động (chiếu lên phương song song với mặt phẳng nghiêng)
            const F_gravity_parallel = m * g * Math.sin(rad);
            const F_friction_max = mu * m * g * Math.cos(rad);
            let a = 0;

            if (inclined_plane.v === 0) {
                // Vật đang đứng yên, kiểm tra điều kiện để bắt đầu chuyển động
                const F_parallel_net = F_pull - F_gravity_parallel;
                if (Math.abs(F_parallel_net) > F_friction_max) {
                    // Thắng được ma sát nghỉ, bắt đầu chuyển động
                    const F_friction_kinetic = Math.sign(F_parallel_net) * F_friction_max;
                    const F_net = F_parallel_net - F_friction_kinetic;
                    a = F_net / m;
                }
            } else {
                // Vật đang chuyển động, ma sát trượt ngược chiều vận tốc
                const F_friction_kinetic = Math.sign(inclined_plane.v) * F_friction_max;
                a = (F_pull - F_gravity_parallel - F_friction_kinetic) / m;
            }

            // Chỉ cập nhật chuyển động nếu vật chưa ra khỏi mặt phẳng
            if (inclined_plane.s < planeLengthM && inclined_plane.s >= 0) {
                inclined_plane.v += a * dt;
                inclined_plane.s += inclined_plane.v * dt;
                inclined_plane.t += dt;
            }
        }

        // Tính toán đường cong phân bố Maxwell-Boltzmann lý thuyết
        function getMaxwellBoltzmannDistribution(T, M) {
            const R = 8.314;
            const k = 4 * Math.PI * Math.pow(M / (2 * Math.PI * R * T), 1.5);
            const exponent_factor = -M / (2 * R * T);
            
            let velocities = [];
            let probabilities = [];
            for (let v = 0; v <= 1500; v += 50) { // Vận tốc từ 0 đến 1500 m/s
                velocities.push(v);
                probabilities.push(k * v * v * Math.exp(exponent_factor * v * v));
            }
            return { velocities, probabilities };
        }

                let x = current_amplitude * Math.cos(omega * spring_horizontal.t);
                // Vận tốc được tính từ đạo hàm của li độ tắt dần
                let v = -Math.exp(-(spring_horizontal.damping / (2 * spring_horizontal.mass)) * spring_horizontal.t) * ( (spring_horizontal.damping / (2 * spring_horizontal.mass)) * spring_horizontal.amplitude * Math.cos(omega * spring_horizontal.t) + omega * spring_horizontal.amplitude * Math.sin(omega * spring_horizontal.t) );
                let KE = 0.5 * spring_horizontal.mass * v * v; 
                let PE = 0.5 * spring_horizontal.k * x * x;
                let E = KE + PE;
                html = `
                    <b>Con lắc lò xo ngang:</b><br>
                    Thời gian: ${(spring_horizontal.t).toFixed(2)} s<br>
                    Độ cứng k: ${spring_horizontal.k} N/m<br>
                    Khối lượng: ${spring_horizontal.mass} kg<br>
                    Biên độ: ${spring_horizontal.amplitude.toFixed(2)} m<br>
                    Vị trí x: ${x.toFixed(2)} m<br>
                    Vận tốc: ${v.toFixed(2)} m/s<br>
                    Động năng (KE): ${KE.toFixed(3)} J<br>
                    Thế năng (PE): ${PE.toFixed(3)} J<br>
                    Năng lượng (E): ${E.toFixed(3)} J
                `;
            } else if (experiment === 'inclined_plane') {
                let rad = inclined_plane.angle * Math.PI / 180;
                const F_net = inclined_plane.F_pull - inclined_plane.mass * inclined_plane.g * Math.sin(rad) - Math.sign(inclined_plane.v) * inclined_plane.friction * inclined_plane.mass * inclined_plane.g * Math.cos(rad);
                let a = F_net / inclined_plane.mass;

                let h = inclined_plane.s * Math.sin(rad); // Độ cao hiện tại so với chân mặt phẳng nghiêng
                let KE = 0.5 * inclined_plane.mass * Math.pow(inclined_plane.v, 2);
                let PE = inclined_plane.mass * inclined_plane.g * h;
                let F_g_parallel = inclined_plane.mass * inclined_plane.g * Math.sin(rad);
                html = `
                    <b>Mặt phẳng nghiêng:</b><br>
                    Thời gian: ${inclined_plane.t.toFixed(2)} s<br>
                    Góc nghiêng: ${inclined_plane.angle}°<br>
                    Khối lượng: ${inclined_plane.mass} kg<br>
                    Gia tốc: ${a.toFixed(2)} m/s²<br>
                    Vận tốc: ${inclined_plane.v.toFixed(2)} m/s<br>
                    Quãng đường: ${inclined_plane.s.toFixed(2)} m<br>
                    Lực kéo: ${inclined_plane.F_pull.toFixed(2)} N<br>
                    Thành phần &parallel; của trọng lực: ${F_g_parallel.toFixed(2)} N<br>
                    Động năng (KE): ${KE.toFixed(3)} J<br>
                    Thế năng (PE): ${PE.toFixed(3)} J<br>
                    Năng lượng (E): ${(KE+PE).toFixed(3)} J
                `;
            }
            document.getElementById('info').innerHTML = html;
        }
